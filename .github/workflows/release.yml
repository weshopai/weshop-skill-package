name: Publish stable release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable semantic version tag matching package.json, for example v0.3.8
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use stable semantic versioning such as v0.3.8."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an OIDC-capable npm CLI
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix web ci

      - name: Validate package
        run: |
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          if [[ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]]; then
            echo "Release tag $RELEASE_TAG must match package.json version v$PACKAGE_VERSION."
            exit 1
          fi
          npm run check
          npm test
          npm run models:validate
          npm run models:routing-validate
          npm run docs:validate
          npm run maintainers:validate
          npm run web:build
          npm run package:check

      - name: Publish npm package
        run: |
          PACKAGE_NAME="$(node -p 'require("./package.json").name')"
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published; continuing bootstrap or retry."
          else
            npm publish --access public
          fi

      - name: Publish release
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --latest
